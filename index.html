<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki doğdun Aslı ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(to bottom, #ff758c, #ff7eb3);
  color: white;
  overflow-x: hidden;
}

h1 {
  margin-top: 30px;
  font-size: 32px;
}

p {
  font-size: 18px;
}

.gallery img {
  width: 80%;
  max-width: 250px;
  margin: 10px;
  border-radius: 20px;
}

button {
  padding: 15px 25px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: white;
  color: #ff4b5c;
  cursor: pointer;
}

#sayac, #geriSayim {
  margin-top: 10px;
  font-size: 20px;
}

#kilitEkrani {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.heart {
  position: fixed;
  bottom: -10px;
  color: red;
  animation: float 5s linear infinite;
}

@keyframes float {
  to {
    transform: translateY(-100vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div id="kilitEkrani">
  <h1>🎁 Sürprize az kaldı ❤️</h1>
  <div id="geriSayim"></div>
</div>

<div id="siteIcerik" style="display:none;">

  <h1>İyi ki doğdun Hayatım ❤️</h1>

  <p>Seninle her şey daha güzel...</p>

  <div id="sayac"></div>

  <div class="gallery">
    <img src="foto1.jpg">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
    <img src="foto5.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
    <img src="foto8.jpg">
    <img src="foto9.jpg">
    <img src="foto10.jpg">
    <img src="foto11.jpg">
    <img src="foto12.jpg">
    <img src="foto13.jpg">
    <img src="foto14.jpg">
    <img src="foto15.jpg">
  </div>

  <button onclick="document.getElementById('muzik').play()">
    🎵 Şarkımızı aç
  </button>

  <audio id="muzik" loop>
    <source src="muzik.mp3" type="audio/mpeg">
  </audio>

  <p>
    Seni çok seviyorum bitanem ❤️
  </p>

</div>

<script>
const hedefTarih = new Date("2026-05-08T00:00:00");
const baslangic = new Date("2024-08-02");

function kontrol() {
  const simdi = new Date();
  const fark = hedefTarih - simdi;

  if (fark <= 0) {
    document.getElementById("kilitEkrani").style.display = "none";
    document.getElementById("siteIcerik").style.display = "block";

    const gecen = simdi - baslangic;
    const gun = Math.floor(gecen / (1000 * 60 * 60 * 24));

    document.getElementById("sayac").innerText =
      gun + " gündür birlikteyiz ❤️";

    return;
  }

  const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
  const saat = Math.floor((fark / (1000 * 60 * 60)) % 24);
  const dakika = Math.floor((fark / (1000 * 60)) % 60);
  const saniye = Math.floor((fark / 1000) % 60);

  document.getElementById("geriSayim").innerText =
    gun + " gün " + saat + " saat " + dakika + " dk " + saniye + " sn kaldı ❤️";
}

kontrol();
setInterval(kontrol, 1000);

setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}, 300);
</script>

</body>
</html>
